<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if_else_if</title>
</head>
<body>
    <script>

let percentage= parseInt(prompt("Enter Your Percentage"));

if(percentage>=90 && percentage<=100){
document.write("Percentage :"+percentage + " Grade A1+" );
}
else if(percentage>=80 && percentage<90){
    document.write("Percentage :"+percentage + " Grade A1" );
}
else if(percentage>=70 && percentage<80){
    document.write("Percentage :"+percentage + " Grade A" );
}
else if(percentage>=60 && percentage<70){
    document.write("Percentage :"+percentage + " Grade B" );
}
else if(percentage>=50 && percentage<60){
    document.write("Percentage :"+percentage + " Grade   C" );
}
else if(percentage>=40&& percentage<50){
    document.write("Percentage :"+percentage + " Grade D" );
}
else if(percentage <40){
    document.write("Fail" );
}

else{
    document.write("Invalid");
}
    </script>

</body>
</html>
