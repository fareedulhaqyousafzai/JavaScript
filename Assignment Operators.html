<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Assignment Operators</title>
</head>
<body>
    <script>
document.write("<h1>"+" Assignment Operators"+"</h1>")

document.write("<h2>"+" + ="+"</h2>");
let add=10;
add +=5;
document.write(add);
document.write("<h2>"+"- ="+"</h2>");
let sub=30;
sub -=5;
document.write(sub); 

document.write("<h2>"+" / ="+"</h2>");
let div=25;
div /=5;
document.write(div); 

document.write("<h2>"+" * ="+"</h2>");
let mul=6;
mul *=3;
document.write(mul); 

document.write("<h2>"+" % ="+"</h2>");
let mod=20;
mod %=6;
document.write(mod); 

document.write("<h2>"+" ** ="+"</h2>");
let exp=5;
exp **=3;
document.write(exp); 



    </script>
</body>
</html>
