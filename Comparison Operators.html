<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operators</title>
</head>
<body>
<script>
    document.write("<h1>"+"Comparison Operators"+"</h1>");
    document.write("<h2>"+" ==	Equal  "+"</h2>");

let ea=10;
let eb=20;
if(ea==eb){ 
document.write("Value is Equle")
}
else{
    document.write("Value is Not Equle")
}

document.write("<h2>"+" ===  equal value and equal type "+"</h2>");
let eta=10;
let etb="10";
if(eta===etb){ 
document.write("Type is Equle")
}
else{
    document.write("Type is Not Equle")
}

document.write("<h2>"+" !=	not equal "+"</h2>");
let nea=10;
let neb=5;
if(nea!==neb){ 
document.write("Value is Not Equle")
}
else{
    document.write("Value is Equle")
}
document.write("<h2>"+" >	greater than "+"</h2>");
let ga=10;
let gb=5;
if(ga > gb){ 
document.write("Value is greater")
}
else{
    document.write("Value is lesser")
}
document.write("<h2>"+" < less than"+"</h2>");
let la=10;
let lb=5;
if(la < lb){ 
document.write("Value is lesser ")
}
else{
    document.write("Value is greater ")
}

document.write("<h2>"+" >= greater than or equal "+"</h2>");
let gea=10;
let geb=9;
if(gea >=geb){ 
document.write("Value is greater  ")
}
else{
    document.write("Value is lesser ")
}

document.write("<h2>"+" <= less than or equal to"+"</h2>");
let lea=10;
let leb=9;
if(lea <=eb){ 
document.write(" Value is lesser   ")
}
else{
    document.write("Value is greater")
}

console.log("2" > 1);
console.log("02" > 1);

console.log(null>0);
console.log(null==0);
console.log(null>=0);

console.log(undefined>0);
console.log(undefined==0);
console.log(undefined>=0);

//=== 
console.log("2"===2);





</script>    
</body>
</html>
