
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        
        <script>
           var age= parseInt(prompt("Enter your 1st Value"));
           var age_2 =parseInt(prompt("Enter your 2nd Value"));

           if (isNaN(age) || isNaN(age_2)) {
       document.write("<h2>Invalid Values</h2>");
   } 
            else if (age !== age_2) {
       document.write("<h2>Values are not Equal</h2>");
   } 
   else {
       document.write("<h2>Values are Equal</h2>");
   }
        </script>
    </body>
    </html>
