<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operators</title>
</head>
<body>
    <script>
document.write("<h1>"+"Arithmetic Operators"+"</h1>");
document.write("<h2>"+"Addition"+"</h2>");
const add_a=10;
const add_b=20;
const add_c=add_a+add_b;
document.write(add_c);

document.write("<h2>"+"Subtraction"+"</h2>");
const sub_a=40;
const sub_b=20;
const sub_c=sub_a-sub_b;
document.write(sub_c);

document.write("<h2>"+"Multiplication"+"</h2>");
const mul_a=5;
const mul_b=3;
const mul_c=mul_a*mul_b;
document.write(mul_c);

document.write("<h2>"+"Division"+"</h2>");
const div_a=75;
const div_b=3;
const div_c=div_a/div_b;
document.write(div_c);

document.write("<h2>"+"Exponentiation"+"</h2>");
const exp_a=50;
const exp_b=3;
const exp_c=exp_a**exp_b;
document.write(exp_c);

document.write("<h2>"+"Modulus"+"</h2>");
const mod_a=18;
const mod_b=5;
const mod_c=mod_a%mod_b;
document.write(mod_c);


document.write("<h2>"+"	Increment"+"</h2>");
let inc_a=20;
inc_a++;
let inc_b=50;
let inc_c=inc_a+inc_b;
document.write(inc_c);

document.write("<h2>"+"Decrement"+"</h2>");
let dec_a=10;
dec_a--;
let dec_b=5;
let dec_c=dec_a+dec_b;
document.write(dec_c);



    </script>
</body>
</html>
