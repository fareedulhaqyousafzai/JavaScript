<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operators</title>
</head>
<body>
    <script>
document.write("<h1>"+"  Logical Operators"+"</h1>")
document.write("<h2>"+" && AND Operators"+"</h2>")
let age=20;
if(age>=18 && age<=22){
    document.write("GOOD")
}
else{

    document.write("Not Good")

}
document.write("<h2>"+"|| OR Operators"+"</h2>")
let marks=14;
if(marks>=18 || marks<=22){
    document.write("Okay")
}
else{

    document.write("Not Okay")

}
document.write("<h2>"+"! NOT Operators"+"</h2>")
var c="USA";
if(!(c=="PAKISTAN")){
    document.write("Welcome")
}
else{

    document.write("Welcome Back")
}

    </script>
</body>
</html>
