<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global & Local Variable</title>
</head>
<body>
    

</body>
<script>
document.write("<h1>Global</h1>")

var a="PAKISTAN";
function abc(){
    document.write(a+"<br>");
}
abc();
document.write(a);

document.write("<h1>Local</h1>")
function xyz(){
    var b="welcome";
    document.write(b);
}
xyz();
document.write(b);

</script>
</html>
