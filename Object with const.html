<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Const Variable with Array & Objects</title>
</head>
<body>
    <script>
        

document.write("<h2>"+"Object"+"</h2>");
const students={
Name:"Fareed",
Age:24,
}
document.write(students.Name+"<br>");
document.write(students.Age+"<br>");
students.Name="Farhan";
students.Age=26;
document.write(students.Name+"<br>");
document.write(students.Age+"<br>");



    </script>
    
</body>
</html>
